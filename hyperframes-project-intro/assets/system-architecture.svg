<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 502" width="31.39cm" height="13.14cm">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070F1E"/>
      <stop offset="100%" stop-color="#121D33"/>
    </linearGradient>

    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#007BFF" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00E5FF" />
    </marker>
  </defs>

  <rect width="1200" height="502" fill="url(#bgGradient)" rx="15"/>

  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="502" fill="url(#grid)" />
  </g>

  <g font-family="Microsoft YaHei, SimHei, sans-serif">
    <!-- Layer 1 -->
    <rect x="100" y="30" width="1000" height="85" fill="#0A152A" stroke="url(#borderGradient)" stroke-width="2" rx="8" stroke-dasharray="8 4"/>
    <text x="115" y="50" fill="#00E5FF" font-size="16" font-weight="bold">1. 边缘终端表现层 Edge Presentation Layer</text>

    <g transform="translate(150, 60)">
      <rect x="0" y="0" width="350" height="45" fill="#112240" stroke="#00E5FF" stroke-width="1" rx="4"/>
      <text x="175" y="18" fill="#FFFFFF" font-size="14" text-anchor="middle" font-weight="bold">消费者溯源与微信监管前端</text>
      <text x="175" y="36" fill="#00E5FF" font-size="11" text-anchor="middle">QR扫描 / 时间轴 / 流式动态渲染</text>
    </g>
    <g transform="translate(700, 60)">
      <rect x="0" y="0" width="350" height="45" fill="#112240" stroke="#00E5FF" stroke-width="1" rx="4"/>
      <text x="175" y="18" fill="#FFFFFF" font-size="14" text-anchor="middle" font-weight="bold">产业链协同角色管理前端</text>
      <text x="175" y="36" fill="#00E5FF" font-size="11" text-anchor="middle">网格控制台 / GIS防伪 / 赋码快照</text>
    </g>

    <!-- Arrows 1-2 -->
    <path d="M 325 115 L 325 135" stroke="#00E5FF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="335" y="116" width="85" height="18" fill="#0A152A" fill-opacity="0.9" rx="4" stroke="#00E5FF" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="377" y="129" fill="#FFFFFF" font-size="11" text-anchor="middle" font-weight="bold">HTTP / SSE</text>

    <path d="M 875 115 L 875 135" stroke="#00E5FF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="885" y="116" width="85" height="18" fill="#0A152A" fill-opacity="0.9" rx="4" stroke="#00E5FF" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="927" y="129" fill="#FFFFFF" font-size="11" text-anchor="middle" font-weight="bold">RESTful API</text>

    <!-- Layer 2 -->
    <rect x="100" y="135" width="1000" height="65" fill="#0A152A" stroke="url(#borderGradient)" stroke-width="2" rx="8" stroke-dasharray="8 4"/>
    <text x="115" y="155" fill="#00E5FF" font-size="16" font-weight="bold">2. 网关与安全过滤层 Gateway &amp; Security Layer</text>

    <g transform="translate(150, 165)">
      <rect x="0" y="0" width="350" height="25" fill="#112240" stroke="#007BFF" stroke-width="1" rx="4"/>
      <text x="175" y="17" fill="#FFFFFF" font-size="14" text-anchor="middle">JWT 无状态双向鉴权守卫</text>
    </g>
    <g transform="translate(700, 165)">
      <rect x="0" y="0" width="350" height="25" fill="#112240" stroke="#007BFF" stroke-width="1" rx="4"/>
      <text x="175" y="17" fill="#FFFFFF" font-size="14" text-anchor="middle">请求限流与跨域边界隔离</text>
    </g>

    <!-- Arrow 2-3 -->
    <path d="M 600 200 L 600 220" stroke="#00E5FF" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

    <!-- Layer 3 -->
    <rect x="100" y="220" width="1000" height="135" fill="#0A152A" stroke="url(#borderGradient)" stroke-width="2" rx="8" stroke-dasharray="8 4"/>
    <text x="115" y="240" fill="#00E5FF" font-size="16" font-weight="bold">3. 核心业务调度中台 Core Business Middleware</text>

    <g transform="translate(140, 250)">
      <rect x="0" y="0" width="280" height="95" fill="#0D1A33" stroke="#4A90E2" stroke-width="1" rx="6"/>
      <text x="140" y="20" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">防篡改特征提取模块</text>
      <rect x="15" y="35" width="250" height="20" fill="#1A2B4C" rx="4" stroke="#00E5FF" stroke-opacity="0.3"/>
      <text x="140" y="50" fill="#E6EDF3" font-size="12" text-anchor="middle">元数据特征 Hash 计算映射</text>
      <rect x="15" y="65" width="250" height="20" fill="#1A2B4C" rx="4" stroke="#00E5FF" stroke-opacity="0.3"/>
      <text x="140" y="80" fill="#E6EDF3" font-size="12" text-anchor="middle">Anchor 锚定记录触发器</text>
    </g>

    <g transform="translate(460, 250)">
      <rect x="0" y="0" width="280" height="95" fill="#0D1A33" stroke="#4A90E2" stroke-width="1" rx="6"/>
      <text x="140" y="20" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">标准溯源状态机模块</text>
      <rect x="15" y="35" width="250" height="20" fill="#1A2B4C" rx="4" stroke="#00E5FF" stroke-opacity="0.3"/>
      <text x="140" y="50" fill="#E6EDF3" font-size="12" text-anchor="middle">GS1-128 数值标准化转换引擎</text>
      <rect x="15" y="65" width="250" height="20" fill="#1A2B4C" rx="4" stroke="#00E5FF" stroke-opacity="0.3"/>
      <text x="140" y="80" fill="#E6EDF3" font-size="12" text-anchor="middle">批次流转与节点表单解析器</text>
    </g>

    <g transform="translate(780, 250)">
      <rect x="0" y="0" width="280" height="95" fill="#0D1A33" stroke="#4A90E2" stroke-width="1" rx="6"/>
      <text x="140" y="20" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">大型语言模型集成模块</text>
      <rect x="15" y="35" width="250" height="20" fill="#1A2B4C" rx="4" stroke="#00E5FF" stroke-opacity="0.3"/>
      <text x="140" y="50" fill="#E6EDF3" font-size="12" text-anchor="middle">RAG 溯源上下文特征构造</text>
      <rect x="15" y="65" width="250" height="20" fill="#1A2B4C" rx="4" stroke="#00E5FF" stroke-opacity="0.3"/>
      <text x="140" y="80" fill="#E6EDF3" font-size="12" text-anchor="middle">SSE 服务端单向流分发代理</text>
    </g>

    <!-- Arrows 3-4 -->
    <path d="M 280 355 L 280 380" stroke="#00E5FF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="290" y="358" width="120" height="18" fill="#0A152A" fill-opacity="0.9" rx="4" stroke="#00E5FF" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="350" y="371" fill="#FFFFFF" font-size="11" text-anchor="middle" font-weight="bold">JSON-RPC 共识广播</text>

    <path d="M 600 355 L 600 380" stroke="#00E5FF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="610" y="358" width="100" height="18" fill="#0A152A" fill-opacity="0.9" rx="4" stroke="#00E5FF" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="660" y="371" fill="#FFFFFF" font-size="11" text-anchor="middle" font-weight="bold">JDBC 结构化写入</text>

    <path d="M 920 355 L 920 380" stroke="#00E5FF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="930" y="358" width="115" height="18" fill="#0A152A" fill-opacity="0.9" rx="4" stroke="#00E5FF" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="987" y="371" fill="#FFFFFF" font-size="11" text-anchor="middle" font-weight="bold">HTTPS 异步调用</text>

    <!-- Layer 4 -->
    <rect x="100" y="380" width="1000" height="85" fill="#0A152A" stroke="url(#borderGradient)" stroke-width="2" rx="8" stroke-dasharray="8 4"/>
    <text x="115" y="400" fill="#00E5FF" font-size="16" font-weight="bold">4. 异构基础设施层 Heterogeneous Infrastructure Layer</text>

    <g transform="translate(140, 410)">
      <polygon points="15,0 275,0 265,45 5,45" fill="#112240" stroke="#00E5FF" stroke-width="1.5"/>
      <text x="140" y="20" fill="#FFFFFF" font-size="14" text-anchor="middle" font-weight="bold">分布式防篡改去中心化账本</text>
      <text x="140" y="38" fill="#00E5FF" font-size="11" text-anchor="middle">EVM Compatible / TxHash 验证</text>
    </g>

    <g transform="translate(460, 410)">
      <ellipse cx="140" cy="22.5" rx="130" ry="22.5" fill="#112240" stroke="#007BFF" stroke-width="1.5"/>
      <text x="140" y="20" fill="#FFFFFF" font-size="14" text-anchor="middle" font-weight="bold">关系型持久化存储底账</text>
      <text x="140" y="38" fill="#00E5FF" font-size="11" text-anchor="middle">MySQL 8.0</text>
    </g>

    <g transform="translate(780, 410)">
      <rect x="10" y="0" width="260" height="45" fill="#112240" stroke="#007BFF" stroke-width="1.5" rx="10"/>
      <text x="140" y="20" fill="#FFFFFF" font-size="14" text-anchor="middle" font-weight="bold">自然语言生成服务集群</text>
      <text x="140" y="38" fill="#00E5FF" font-size="11" text-anchor="middle">Tencent Hunyuan API</text>
    </g>

    <text x="600" y="490" fill="#FFFFFF" font-size="20" font-weight="bold" text-anchor="middle" filter="url(#neonGlow)">图 1. 系统总体架构设计模型 (System Architecture Design Model)</text>
  </g>
</svg>
