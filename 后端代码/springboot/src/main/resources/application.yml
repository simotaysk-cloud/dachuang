spring:
  profiles:
    active: dev
  mvc:
    async:
      request-timeout: 300000 # 5分钟，防止 AI 慢速输出时超时
  application:
    name: dachuang
  main:
    web-application-type: servlet

server:
  port: 8091

ai:
  compat:
    base-url: ${AI_COMPAT_BASE_URL:}
    api-key: ${AI_COMPAT_API_KEY:}
    model: ${AI_COMPAT_MODEL:}
  hunyuan:
    base-url: "https://api.hunyuan.cloud.tencent.com/v1"
    api-key: ${AI_API_KEY:sk-placeholder}
    model: "hunyuan-lite"
